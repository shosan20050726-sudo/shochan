<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>APEX PROTOCOL</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05070a; }
  body { font-family: "Rajdhani", "DIN Alternate", "Bahnschrift", system-ui, sans-serif; }
  #game { display: block; width: 100vw; height: 100vh; }
  #ui-root { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #boot {
    position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
    background: radial-gradient(ellipse at 50% 40%, #14202e 0%, #05070a 70%);
    color: #e6f0f7; letter-spacing: .18em; text-transform: uppercase;
    transition: opacity .6s ease; font-size: 14px;
  }
  #boot.hidden { opacity: 0; pointer-events: none; }
  #boot .title { font-size: 46px; font-weight: 700; letter-spacing: .32em;
    background: linear-gradient(180deg,#fff,#7fd4ff); -webkit-background-clip: text;
    background-clip: text; color: transparent; margin-bottom: 18px; }
  #boot .bar { width: 320px; height: 2px; background: #1d2b3a; margin: 22px auto; overflow: hidden; }
  #boot .bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg,#ff6a1a,#ffd36a); transition: width .25s; }
  #boot .hint { opacity: .55; font-size: 11px; margin-top: 10px; }
  #crash { position: fixed; inset: 0; z-index: 200; display: none; padding: 32px;
    background: #0a0406; color: #ff9c9c; font-family: ui-monospace, monospace;
    font-size: 12px; white-space: pre-wrap; overflow: auto; }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui-root"></div>
  <div id="boot">
    <div style="text-align:center">
      <div class="title">APEX PROTOCOL</div>
      <div id="boot-status">initialising</div>
      <div class="bar"><i id="boot-bar"></i></div>
      <div class="hint">click to lock pointer &nbsp;·&nbsp; WASD move &nbsp;·&nbsp; shift sprint &nbsp;·&nbsp; ctrl slide &nbsp;·&nbsp; Q tactical &nbsp;·&nbsp; Z ultimate</div>
    </div>
  </div>
  <pre id="crash"></pre>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
