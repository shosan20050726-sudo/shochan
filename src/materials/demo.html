<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Material Forge — showcase</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05070a; }
  body { font-family: system-ui, sans-serif; color: #dfe8f2; }
  #gl { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; left: 12px; top: 12px; z-index: 5; font-size: 12px;
    letter-spacing: .06em; opacity: .8; text-shadow: 0 1px 3px #000;
    pointer-events: none; line-height: 1.5;
  }
  #boot {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: #05070a; color: #9fd4ff; letter-spacing: .2em; font-size: 13px;
    text-transform: uppercase; transition: opacity .3s;
  }
  #boot.hidden { opacity: 0; pointer-events: none; }
  #err { position: fixed; inset: 0; z-index: 30; display: none; padding: 24px;
    background: #12060a; color: #ff9c9c; font: 12px ui-monospace, monospace;
    white-space: pre-wrap; overflow: auto; }
</style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="hud"></div>
  <div id="boot"><span id="boot-msg">forging textures…</span></div>
  <pre id="err"></pre>
  <script>
    // Module fetch/parse failures never reach window.onerror, so the harness
    // would otherwise sit there for the whole boot budget. Catch them here.
    window.addEventListener('error', function (e) {
      if (e.target && e.target !== window) {
        window.__BOOT_FAILED = true;
        var el = document.getElementById('err');
        el.style.display = 'block';
        el.textContent = 'RESOURCE ERROR: ' + (e.target.src || e.target.href);
      }
    }, true);
    setTimeout(function () {
      if (!window.__DEMO_STARTED) window.__BOOT_FAILED = true;
    }, 15000);
  </script>
  <script type="module" src="./demo.js"></script>
</body>
</html>
